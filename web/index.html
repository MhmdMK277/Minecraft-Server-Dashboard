<!doctype html>
<!-- Dark only, by decision. The class exists so component dark: variants
     match; the values themselves live in :root (web/index.css). -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      connect-src is 'self' and not ws://localhost:*, which is what it said while
      this was a desktop app. The point of the web pivot is reaching the
      dashboard from another machine, so the WebSocket origin is whatever host
      the page was served from -- pinning it to localhost would have blocked
      exactly the case the pivot exists for. CSP3 'self' matches a same-origin
      nosemgrep: javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket -- documentation text, not code; ws:// follows from the plain-HTTP LAN deployment decision (docs/security-audit.md).
      ws:// connection.
    -->
    <!--
      The avatar host is named below but NOT permitted by this tag alone.
      Browsers intersect every policy they are given, and in production the
      service sends its own header which omits that host unless the operator
      has turned player avatars on. This tag is the dev-server policy, where
      our header is not in play; the header is the gate.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://minotar.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Minecraft Server Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
